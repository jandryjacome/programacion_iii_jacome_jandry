<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transiciones en la biblioteca</title>
    <link rel="stylesheet" href="18_transiciones.css">
</head>
<body>
    <main>
        <h1>Lectura en movimiento</h1>
        <div class="espacio">
            <div class="xwing">📖</div>
        </div>
        <div class="espacio2">
            <div class="xwing2">📖</div>
        </div>
        <div class="alerta">Libro reservado</div>
        <h1>Catálogo de la biblioteca</h1>
        <p>Coloca el cursor sobre el botón</p>
        <button class="boton-jedi">Consultar catálogo</button>
        <div class="tarjeta">
            <h2>El principito</h2>
            <p>Libro recomendado</p>
        </div>
        <br>
        <br>
        <h1>Estantería de novedades</h1>
        <div class="hangar">
            <div class="nave">Libro nuevo</div>
        </div>
        <h1>Buscador de libros</h1>
        <div class="radar">
            <div class="indicador">📖</div>
        </div>
        <h1>Estantería de lecturas</h1>
        <div class="hangar2">
            <div class="nave2">📚</div>
        </div>
    </main>
</body>
</html>
