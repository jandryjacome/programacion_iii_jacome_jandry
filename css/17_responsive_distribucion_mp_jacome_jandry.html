<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribución responsive de biblioteca</title>
    <link rel="stylesheet" href="17_responsive_distribucion_mp_jacome_jandry.css">
</head>
<body>
    <header>
        <h1>Biblioteca de Jandry</h1>
    </header>

    <div class="distribucion">
        <main class="principal">
            <h2>Libros destacados</h2>
            <section class="libros">
                <article>La biblioteca perdida</article>
                <article>Historia de la ciencia</article>
                <article>Programación práctica</article>
            </section>
        </main>

        <aside class="lateral">
            <h2>Categorías</h2>
            <ul>
                <li>Aventura</li>
                <li>Historia</li>
                <li>Tecnología</li>
            </ul>
        </aside>
    </div>
</body>
</html>
