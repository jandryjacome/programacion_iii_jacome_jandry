<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo responsive de biblioteca</title>
    <link rel="stylesheet" href="16_responsive_mp_jacome_jandry.css">
</head>
<body>
    <header>
        <h1>Biblioteca de Jandry</h1>
        <p>Catálogo de libros disponibles</p>
    </header>

    <main class="catalogo">
        <article class="libro">
            <h2>La biblioteca perdida</h2>
            <p>Aventura</p>
        </article>
        <article class="libro">
            <h2>Historia de la ciencia</h2>
            <p>Historia</p>
        </article>
        <article class="libro">
            <h2>Programación práctica</h2>
            <p>Tecnología</p>
        </article>
        <article class="libro">
            <h2>Poemas para leer</h2>
            <p>Poesía</p>
        </article>
    </main>
</body>
</html>
