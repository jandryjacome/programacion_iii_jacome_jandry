<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Tablas</title>
</head>
<body>
    <h1>Libros de la biblioteca</h1>
    <table alt="Tabla de libros" border="1">
        <caption>Catalogo de libros</caption>
        <tr>
            <th colspan="3">Libros disponibles</th>
        </tr>
        <tr>
            <th>Libro</th>
            <th>Autor</th>
            <th>Genero</th>
        </tr>
        <tr>
            <td>Cien años de soledad</td>
            <td>Gabriel Garcia Marquez</td>
            <td>Novela</td>
        </tr>
        <tr>
            <td>Huasipungo</td>
            <td>Jorge Icaza</td>
            <td>Novela</td>
        </tr>
    </table>
    <br>
    <table>
        <caption>Prestamos de la biblioteca</caption>
        <thead>
            <tr>
                <th>Lector</th>
                <th>Libro</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Maria</td>
                <td>Don Quijote de la Mancha</td>
                <td>Prestado</td>
            </tr>
            <tr>
                <td>Jorge</td>
                <td>Huasipungo</td>
                <td>Disponible</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
