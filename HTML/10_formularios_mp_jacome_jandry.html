<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de socios</title>
</head>
<body>
    <form action="/register" method="POST">
        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>

        <label for="apellido">Apellido: </label>
        <input type="text" id="apellido" name="apellido" required>
        <br><br>

        <label for="password">Contrasena: </label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="confirm-password">Confirmar contrasena: </label>
        <input type="password" id="confirm-password" name="confirm_password" required>
        <br><br>

        <label for="edad">Edad: </label>
        <input type="number" id="edad" name="edad" required>
        <br><br>

        <label for="libros">Cantidad de libros prestados: </label>
        <input type="number" id="libros" name="libros" min="0" max="3" value="0">
        <br><br>

        <label for="genero">Seleccione su genero favorito: </label>
        <select name="genero" id="genero">
            <option value="novela">Novela</option>
            <option value="cuento">Cuento</option>
            <option value="historia">Historia</option>
        </select>
        <br><br>
        <label for="socio">Tipo de socio: </label>
        <select name="socio" id="socio">
            <option value="estudiante">Estudiante</option>
            <option value="docente">Docente</option>
            <option value="general">Publico general</option>
        </select>
        <br><br>
        <label for="libro">Libro de interes: </label>
        <input type="text" id="libro" name="libro" required>
        <br><br>
        <label for="seccion">Seleccione una seccion: </label>
        <select name="seccion" id="seccion">
            <option value="novelas">Novelas</option>
            <option value="infantil">Infantil</option>
            <option value="consulta">Consulta</option>
        </select>
        <br><br>
        <fieldset>
            <legend>Datos generales:</legend>
            <label for="masculino">Masculino</label>
            <input type="radio" id="masculino" name="genero_persona" value="masculino">
            <label for="femenino">Femenino</label>
            <input type="radio" id="femenino" name="genero_persona" value="femenino">
            <label for="otro">Otro</label>
            <input type="radio" id="otro" name="genero_persona" value="otro">
        </fieldset>
        <button type="reset">Limpiar</button>
        <button type="submit">Registrarse</button>
    </form>
</body>
</html>
